version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -E '^(ADMIN_EMAIL|ADMIN_PASSWORD|ADMIN_SESSION_TOKEN|DATABASE_URL|CRON_SECRET|NOTIFICATION_WEBHOOK_URL|NOTIFICATION_WEBHOOK_SECRET|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|TWILIO_PHONE_NUMBER|ENQUIRY_WEBHOOK_URL|INSTAGRAM_WEST_STREET_ACCOUNT_ID|INSTAGRAM_WEST_STREET_ACCESS_TOKEN|INSTAGRAM_WATLINGTON_STREET_ACCOUNT_ID|INSTAGRAM_WATLINGTON_STREET_ACCESS_TOKEN|GOOGLE_PLACES_API_KEY|GOOGLE_WEST_STREET_PLACE_ID|GOOGLE_WATLINGTON_STREET_PLACE_ID|NEXT_PUBLIC_)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
