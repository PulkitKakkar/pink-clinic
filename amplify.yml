version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22.22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -E '^(ADMIN_EMAIL|ADMIN_PASSWORD|ADMIN_SESSION_TOKEN|ACADEMY_ADMIN_EMAIL|ACADEMY_ADMIN_PASSWORD|ACADEMY_ADMIN_SESSION_TOKEN|STUDIO_ADMIN_EMAIL|STUDIO_ADMIN_PASSWORD|STUDIO_ADMIN_SESSION_TOKEN|DATABASE_URL|TREATMENT_IMAGES_REGION|TREATMENT_IMAGES_BUCKET|LEARNER_FILES_REGION|LEARNER_FILES_BUCKET|CRON_SECRET|NOTIFICATION_WEBHOOK_URL|NOTIFICATION_WEBHOOK_SECRET|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|TWILIO_PHONE_NUMBER|ENQUIRY_WEBHOOK_URL|RESEND_API_KEY|ENQUIRY_FROM_EMAIL|GETADDRESS_API_KEY|INSTAGRAM_WEST_STREET_ACCOUNT_ID|INSTAGRAM_WEST_STREET_ACCESS_TOKEN|INSTAGRAM_WATLINGTON_STREET_ACCOUNT_ID|INSTAGRAM_WATLINGTON_STREET_ACCESS_TOKEN|GOOGLE_PLACES_API_KEY|GOOGLE_WEST_STREET_PLACE_ID|GOOGLE_WATLINGTON_STREET_PLACE_ID|NEXT_PUBLIC_)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
