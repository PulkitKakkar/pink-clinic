name: Create GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi

      - name: Write release metadata
        run: |
          mkdir -p release
          node -e "const fs = require('fs'); const pkg = require('./package.json'); fs.writeFileSync('release/release-info.json', JSON.stringify({ version: pkg.version, tag: process.env.GITHUB_REF_NAME, commit: process.env.GITHUB_SHA, builtAt: new Date().toISOString() }, null, 2));"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/release-info.json --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
